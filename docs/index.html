<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyCluster Documentation - v0.0.2</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.6;
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px;
      background: #0f0f14;
      color: #fff;
    }
    h1 { color: #e94560; margin-bottom: 10px; font-size: 2.5rem; }
    h2 { color: #e94560; margin: 30px 0 15px; border-bottom: 1px solid #2a2a3a; padding-bottom: 10px; }
    h3 { margin: 25px 0 10px; color: #fff; }
    h4 { margin: 20px 0 8px; color: #a0a0b0; }
    a { color: #2196f3; text-decoration: none; }
    a:hover { text-decoration: underline; }
    code { background: #1a1a2e; padding: 2px 6px; border-radius: 3px; font-family: 'Fira Code', monospace; font-size: 0.9em; }
    pre { background: #1a1a2e; padding: 20px; border-radius: 6px; overflow-x: auto; margin: 15px 0; border: 1px solid #2a2a3a; }
    pre code { background: none; padding: 0; color: #fff; }
    table { width: 100%; border-collapse: collapse; margin: 20px 0; }
    th, td { border: 1px solid #2a2a3a; padding: 12px; text-align: left; }
    th { background: #16161e; color: #e94560; }
    tr:nth-child(even) { background: #16161e; }
    ul, ol { margin: 10px 0 10px 25px; }
    li { margin: 8px 0; }
    blockquote { border-left: 3px solid #e94560; padding-left: 15px; margin: 20px 0; color: #a0a0b0; }
    .tag { display: inline-block; background: #e94560; color: #fff; padding: 2px 8px; border-radius: 3px; font-size: 0.85rem; margin-left: 10px; }
    .warning { background: #2a1a1a; border-left: 3px solid #ff9800; padding: 15px; margin: 20px 0; }
    .success { background: #1a2a1a; border-left: 3px solid #4caf50; padding: 15px; margin: 20px 0; }
    .info { background: #1a1a2e; border-left: 3px solid #2196f3; padding: 15px; margin: 20px 0; }
    img { max-width: 100%; height: auto; }
    hr { border: none; border-top: 1px solid #2a2a3a; margin: 30px 0; }
  </style>
</head>
<body>
  <div id="content"></div>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script>
    fetch('README.md')
      .then(r => r.text())
      .then(md => {
        document.getElementById('content').innerHTML = marked.parse(md);
        // Open all external links in new tab
        document.querySelectorAll('a[href^="http"]').forEach(a => {
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
        });
      });
  </script>
</body>
</html>
