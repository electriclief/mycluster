name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 0.0.2)'
        required: true
        default: '0.0.2'

permissions:
  contents: write
  actions: write

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npm run build:core && npm run build -w @mycluster/storage-yaml
      
      - name: Build Electron app
        run: npm run build -w @mycluster/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: apps/desktop/release/*.{exe,blockmap}
          if-no-files-found: error
      
      - name: Create/Update GitHub Release (Draft)
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            apps/desktop/release/MyCluster Setup *.exe
            apps/desktop/release/MyCluster *.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    runs-on: ubuntu-latest
    if: false # Disabled for v0.0.2, enabled in future
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npm run build:core && npm run build -w @mycluster/storage-yaml
      
      - name: Build Electron app (Linux)
        run: npm run build -w @mycluster/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: apps/desktop/release/*.{AppImage,deb}
          if-no-files-found: error

  build-macos:
    runs-on: macos-latest
    if: false # Disabled for v0.0.2, enabled in future
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build packages
        run: npm run build:core && npm run build -w @mycluster/storage-yaml
      
      - name: Build Electron app (macOS)
        run: npm run build -w @mycluster/desktop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-builds
          path: apps/desktop/release/*.dmg
          if-no-files-found: error
