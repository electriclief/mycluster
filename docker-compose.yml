version: '3.8'

services:
  # MyCluster Server
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: mycluster/server:latest
    container_name: mycluster-server
    ports:
      - "3000:3000"
    volumes:
      - mycluster-data:/root/.mycluster
      - mycluster-results:/root/.mycluster/results
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
    restart: unless-stopped
    networks:
      - mycluster-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MyCluster Agent (optional - can run multiple)
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    image: mycluster/agent:latest
    container_name: mycluster-agent-1
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - mycluster-workspace:/workspace
    environment:
      - SERVER_URL=http://server:3000
      - WORKSPACE_DIR=/workspace
      - PYTHON_PATH=python3
    restart: unless-stopped
    networks:
      - mycluster-network
    # Uncomment to run agent
    # profiles:
    #   - agents

  # Optional: Second agent instance
  agent-2:
    image: mycluster/agent:latest
    container_name: mycluster-agent-2
    depends_on:
      server:
        condition: service_healthy
    volumes:
      - mycluster-workspace-2:/workspace
    environment:
      - SERVER_URL=http://server:3000
      - WORKSPACE_DIR=/workspace
      - PYTHON_PATH=python3
      - AGENT_NAME=agent-2
    restart: unless-stopped
    networks:
      - mycluster-network
    profiles:
      - agents

volumes:
  mycluster-data:
    driver: local
  mycluster-results:
    driver: local
  mycluster-workspace:
    driver: local
  mycluster-workspace-2:
    driver: local

networks:
  mycluster-network:
    driver: bridge
